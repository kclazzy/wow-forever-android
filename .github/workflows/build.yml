name: Build APK

on:
  workflow_dispatch:
    inputs:
      driver_url:
        description: "Optional direct URL to a Turnip zip for Adreno 610 (saved as turnip-a6xx-lowend.zip)"
        required: false
        default: ""
  push:
    branches: [redmi-note-13-sd685]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed to publish the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK (ANDROID_HOME); only licenses and the NDK are needed.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;27.3.13750724" > /dev/null
          # secrets-gradle-plugin fails configuration without this file.
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch runtime components (Wine/Proton, DXVK, Turnip)
        run: |
          chmod +x tools/fetch_components.sh gradlew
          tools/fetch_components.sh

      # Bundle an Adreno 610 Turnip driver: driver_url if given, otherwise the newest turnip-a6xx-lowend-* release
      # of this repository (built by the "Build Turnip" workflow).
      - name: Bundle Adreno 610 Turnip driver
        env:
          GH_TOKEN: ${{ github.token }}
          DRIVER_URL: ${{ github.event.inputs.driver_url }}
        run: |
          DEST=app/src/main/assets/bundled_components/turnip-a6xx-lowend.zip
          if [ -z "$DRIVER_URL" ]; then
            DRIVER_URL="$(gh api "repos/${{ github.repository }}/releases?per_page=30" \
              --jq '[.[] | select(.tag_name | startswith("turnip-a6xx-lowend-"))][0].assets[] | select(.name == "turnip-a6xx-lowend.zip") | .browser_download_url' || true)"
          fi
          if [ -n "$DRIVER_URL" ]; then
            echo "Bundling driver from $DRIVER_URL"
            curl -fL --retry 3 -o "$DEST" "$DRIVER_URL"
            unzip -l "$DEST"
          else
            echo "::warning::No Adreno 610 Turnip driver found; the APK will fall back to the Adreno 740 driver."
          fi

      - name: Unit tests (WoW launcher)
        id: tests
        continue-on-error: true
        run: >
          ./gradlew testModernDebugUnitTest --no-daemon
          --tests 'app.gamenative.ui.screen.wow.*'
          --tests 'app.gamenative.utils.LogMirrorTest'
          --tests 'app.gamenative.utils.ExitReportTest'
          --tests 'app.gamenative.utils.ExeProbeTest'
          --tests 'app.gamenative.utils.LogcatDumpTest'
          --tests 'com.winlator.core.DXVKHelperTest'
          --tests 'com.winlator.core.ProcessExitStatusTest'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleModernDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wow-forever-redmi-note-13-debug
          path: app/build/outputs/apk/modern/debug/*.apk

      # A Release gives a stable, resumable download link that works without a GitHub login.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="$(ls app/build/outputs/apk/modern/debug/*.apk | head -1)"
          TAG="redmi-note-13-build-${{ github.run_number }}"
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Redmi Note 13 (SD 685) debug build #${{ github.run_number }}" \
            --notes "Unofficial debug build. No Adreno 610 Turnip driver is bundled unless driver_url was given; without it the game will most likely not start on an Adreno 610."

      - name: Fail the run if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Unit tests failed; the APK above was still built. See the unit-test-report artifact."
          exit 1
