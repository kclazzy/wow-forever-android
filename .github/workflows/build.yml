name: Build APK

on:
  workflow_dispatch:
    inputs:
      driver_url:
        description: "Optional direct URL to a Turnip zip for Adreno 610 (saved as turnip-a6xx-lowend.zip)"
        required: false
        default: ""
  push:
    branches: [redmi-note-13-sd685]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The runner image already ships the Android SDK (ANDROID_HOME); only licenses and the NDK are needed.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "ndk;27.3.13750724" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch runtime components (Wine/Proton, DXVK, Turnip)
        run: |
          chmod +x tools/fetch_components.sh gradlew
          tools/fetch_components.sh

      - name: Optional Adreno 610 Turnip driver
        if: ${{ github.event.inputs.driver_url != '' }}
        env:
          DRIVER_URL: ${{ github.event.inputs.driver_url }}
        run: |
          curl -fL --retry 3 -o app/src/main/assets/bundled_components/turnip-a6xx-lowend.zip "$DRIVER_URL"
          unzip -l app/src/main/assets/bundled_components/turnip-a6xx-lowend.zip | head -20

      - name: Unit tests (WoW launcher)
        id: tests
        continue-on-error: true
        run: >
          ./gradlew testModernDebugUnitTest --no-daemon
          --tests 'app.gamenative.ui.screen.wow.*'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleModernDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: wow-forever-redmi-note-13-debug
          path: app/build/outputs/apk/modern/debug/*.apk

      - name: Fail the run if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "Unit tests failed; the APK above was still built. See the unit-test-report artifact."
          exit 1
